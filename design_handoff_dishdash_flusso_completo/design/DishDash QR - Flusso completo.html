<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DishDash QR — Flusso completo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="colors_and_type.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #f1f3f5;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }

      .dd-app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ---- top toolbar ---- */
      .dd-topbar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #dee2e6;
        z-index: 30;
        flex-wrap: wrap;
      }
      .dd-viewseg .btn {
        --bs-btn-padding-y: 0.25rem;
      }

      /* ---- stage ---- */
      .dd-stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        gap: 18px;
        padding: 18px;
        overflow: auto;
        align-items: stretch;
      }
      .dd-pane-cliente {
        flex: none;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .dd-pane-staff {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
      }

      /* ---- phone ---- */
      .dd-phone-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .dd-phone {
        position: relative;
        width: 392px;
        height: 800px;
        max-height: calc(100vh - 130px);
        background: #fff;
        border: 10px solid #1b1c1f;
        border-radius: 40px;
        overflow: hidden;
        box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.18);
      }
      .dd-phone-notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 26px;
        background: #1b1c1f;
        border-radius: 0 0 16px 16px;
        z-index: 5;
      }
      .dd-phone-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .flex-none {
        flex: none;
      }

      /* ---- staff device ---- */
      .dd-staff-device {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #dee2e6;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.06);
      }
      .dd-rolebar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
      }
      .dd-staff-screen {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      .dd-staff-screen > div {
        flex: 1 1 auto;
        min-width: 0;
      }

      /* ---- login ---- */
      .dd-login-wrap {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 1px 1px, #e3e6ea 1px, transparent 0) 0 0/22px 22px,
          #f1f3f5;
        border: 1px solid #dee2e6;
        border-radius: 14px;
      }
      .dd-login-card {
        width: 360px;
        max-width: 100%;
        box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.1);
      }

      /* ---- tenant logo placeholder ---- */
      .dd-tenant-logo {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: #f1f3f5;
        color: #adb5bd;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        flex: none;
      }

      /* ---- tracking stepper ---- */
      .dd-step-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
      }
      .dd-pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bs-primary);
        display: inline-block;
        animation: dd-pulse 1.2s ease-in-out infinite;
      }
      @keyframes dd-pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.25);
        }
      }

      /* ---- new/changed order highlight ---- */
      .dd-flash {
        animation: dd-flash 3s ease-out 1;
      }
      @keyframes dd-flash {
        0% {
          box-shadow:
            0 0 0 3px var(--bs-primary),
            0 0 0 0 rgba(var(--bs-primary-rgb, 217, 72, 15), 0.45);
        }
        12% {
          box-shadow:
            0 0 0 3px var(--bs-primary),
            0 0 0 10px rgba(var(--bs-primary-rgb, 217, 72, 15), 0);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      /* ---- QR scan ---- */
      .dd-scanframe {
        position: relative;
        padding: 14px;
        border-radius: 18px;
        border: 2px solid rgba(255, 255, 255, 0.25);
      }
      .dd-scanframe.is-found {
        border-color: var(--bs-success);
      }
      .dd-scanline {
        position: absolute;
        left: 14px;
        right: 14px;
        height: 3px;
        top: 14px;
        background: linear-gradient(90deg, transparent, #4dd07f, transparent);
        box-shadow: 0 0 12px #4dd07f;
        animation: dd-scan 1.6s ease-in-out infinite;
      }
      @keyframes dd-scan {
        0%,
        100% {
          top: 14px;
        }
        50% {
          top: calc(100% - 18px);
        }
      }

      /* ---- monthly report bar chart ---- */
      .dd-bars {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 150px;
        padding-bottom: 16px;
      }
      .dd-bar-col {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .dd-bar {
        width: 100%;
        max-width: 16px;
        border-radius: 3px 3px 0 0;
        transition: height 0.2s;
      }
      .dd-bar-col:hover .dd-bar {
        filter: brightness(0.9);
      }
      .dd-bar-lbl {
        position: absolute;
        bottom: -16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: #adb5bd;
      }
      .dd-legend {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        display: inline-block;
      }

      /* ---- modal ---- */
      .dd-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1080;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .dd-modal-backdrop .modal-dialog {
        margin: 0;
        width: 460px;
        max-width: 100%;
      }
      .dd-modal-backdrop .modal-content {
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.3);
      }

      /* responsive: stack on narrow screens */
      @media (max-width: 920px) {
        body {
          overflow: auto;
        }
        .dd-app {
          height: auto;
          min-height: 100%;
        }
        .dd-stage {
          flex-direction: column;
          align-items: center;
          overflow: visible;
        }
        .dd-pane-staff {
          width: 100%;
        }
        .dd-staff-screen {
          min-height: 620px;
        }
        .dd-phone {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script src="app/data.js"></script>
    <script type="text/babel" src="app/tweaks-panel.jsx"></script>
    <script type="text/babel" src="app/store.jsx"></script>
    <script type="text/babel" src="app/Primitives.jsx"></script>
    <script type="text/babel" src="app/Cliente.jsx"></script>
    <script type="text/babel" src="app/Gestore.jsx"></script>
    <script type="text/babel" src="app/Lavoratore.jsx"></script>
    <script type="text/babel" src="app/Superuser.jsx"></script>
    <script type="text/babel" src="app/Shell.jsx"></script>
  </body>
</html>
