name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid overlapping deploys if you push twice quickly.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

  deploy:
    name: Trigger Render deploy
    needs: ci
    runs-on: ubuntu-latest
    # Secrets live in the "production" GitHub Environment, so the job must opt in.
    environment: production
    # Runs on every push to main and on manual dispatch, but only after `ci`
    # (build + type-check) passes — a broken build never reaches production.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      # https://github.com/marketplace/actions/deploy-to-render
      - name: Deploy to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: true # force a clean build (no cached Docker layers)
          wait_deploy: true # block the job until Render reports success/failure

  bootstrap-superuser:
    name: Ensure initial superuser
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    # Runs after a successful deploy to guarantee the initial superuser exists.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The initial superuser is the only account provisioned out-of-band
      # (there is no public registration — see CLAUDE.md §3). Idempotent upsert:
      # creates it if missing, otherwise resets its password to the secret.
      - name: Upsert superuser in production DB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_USERNAME }}
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: npm run create-superuser
