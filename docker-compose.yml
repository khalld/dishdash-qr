# docker-compose.yml
#
# Quick start:
#   docker compose up --build -d        # create a .env with your values first
#
# Run seed script inside the running container:
#   docker compose exec app npm run seed

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build the final (runner) stage only
      target: runner
    image: dishdash-qr
    container_name: dishdash-qr
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
